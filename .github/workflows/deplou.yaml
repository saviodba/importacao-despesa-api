
name: Build and Deploy - Protege Importacao

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "*.sln"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: protege-importacao-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar codigo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login no GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Definir nome da imagem
      - name: Set image variables
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      # 5. Build e Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

      # 6. Atualizar Deployment Kubernetes
      - name: Update Kubernetes Deployment
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:${TAG}|" k8s/deployment.yaml

      # 7. Commit da nova versao
      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore: update API image to ${GITHUB_SHA::12}"
            git push
          fi

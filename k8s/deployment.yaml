
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protege-importacao-api
  namespace: protege-importacao
spec:
  replicas: 1

  selector:
    matchLabels:
      app: protege-importacao-api

  template:
    metadata:
      labels:
        app: protege-importacao-api

    spec:
      containers:
        - name: api
          image: ghcr.io/saviodev/protege-importacao-api:v1.0.0

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

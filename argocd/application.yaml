
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: protege-importacao-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/saviodba/importacao-despesa-api.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: protege-importacao

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
